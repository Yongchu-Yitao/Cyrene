name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / locked contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment with all testable extras
        run: uv sync --locked --all-extras

      - name: Set up Node.js for generated WebUI fixtures
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: src/webui/package-lock.json

      - name: Build WebUI fixtures used by the Python contract suite
        working-directory: src/webui
        run: |
          npm ci
          npm run build

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src

      - name: Lint Python sources
        run: uv run --locked ruff check src tests

      - name: Run full Python suite
        run: >-
          uv run --locked pytest -q
          -W error::pytest.PytestUnhandledThreadExceptionWarning

  webui-electron:
    name: WebUI build / Electron tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            src/webui/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install WebUI dependencies
        working-directory: src/webui
        run: npm ci

      - name: Build WebUI
        working-directory: src/webui
        run: npm run build

      - name: Run WebUI tests
        working-directory: src/webui
        run: npm test

      - name: Verify generated WebUI is current
        run: git diff --exit-code -- src/webui/static/app

      - name: Run Electron tests
        run: node --test electron/*.test.js

      - name: Check patch formatting
        run: git diff --check
