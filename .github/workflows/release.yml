name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - windows-x64
          - windows-arm64
permissions:
  actions: read
  checks: read
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ==========================================================================
  # macOS Build
  # ==========================================================================
  build-macos:
    needs: [release]
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/cyrene/workbench/webui/package-lock.json

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging
          pip install .
          pip install --upgrade typing_extensions pydantic pydantic_core
          # OpenCV is NOT bundled (spec excludes cv2; OCR downloads the full
          # wheel on demand via cyrene.plugins.builtin.cyrene_knowledge.opencv_runtime). The
          # headless wheel avoids GUI system deps in the build environment.
          pip uninstall -y opencv-python
          pip install opencv-python-headless

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Build WebUI JS
        run: cd src/cyrene/workbench/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify critical imports
        run: python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; print('imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py

      - name: Install and smoke test macOS package
        id: macos_package_smoke
        continue-on-error: true
        run: build/macos-release-smoke.sh

      - name: Upload macOS DMG
        id: macos_package_artifact
        continue-on-error: true
        if: ${{ steps.macos_package_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist-electron/Cyrene-*-mac.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Publish macOS DMG
        id: macos_package_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.macos_package_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-mac.dmg --clobber

      - name: Report all macOS validation failures
        if: always()
        shell: bash
        env:
          PACKAGE_SMOKE_OUTCOME: ${{ steps.macos_package_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.macos_package_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.macos_package_publish.outcome }}
        run: |
          failures=()
          test "$PACKAGE_SMOKE_OUTCOME" = success || failures+=("package smoke: $PACKAGE_SMOKE_OUTCOME")
          test "$ARTIFACT_OUTCOME" = success || test "$ARTIFACT_OUTCOME" = skipped || failures+=("DMG artifact upload: $ARTIFACT_OUTCOME")
          test "$PUBLISH_OUTCOME" = success || test "$PUBLISH_OUTCOME" = skipped || failures+=("GitHub release upload: $PUBLISH_OUTCOME")
          if ((${#failures[@]})); then
            printf 'macOS pre-release validation failures (%s):\n' "${#failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

  # ==========================================================================
  # Windows Build
  # ==========================================================================
  build-windows:
    needs: [release]
    if: ${{ inputs.platforms != 'windows-arm64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/cyrene/workbench/webui/package-lock.json

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging pypdf reportlab
          pip install pybind11 setuptools wheel
          pip install aiosqlite anyio apscheduler croniter fastapi "httpx[http2]==0.28.1" "jinja2==3.1.6" python-dotenv python-telegram-bot requests sniffio watchfiles websockets python-multipart certifi==2025.7.14 h11 idna
          pip install winloop "pyte>=0.8.2" pywinpty==3.0.5
          # simplexng and its transitive deps (it uses --no-deps so we list them explicitly)
          pip install simplexng --no-deps
          pip install babel==2.17.0 brotli==1.1.0 "clideps>=0.1.6" flask==3.1.1 flask-babel==4.0.0 "httpx-socks[asyncio]==0.10.0" isodate==0.7.2 lxml==6.0.0 markdown-it-py==3.0.0 msgspec==0.19.0 "platformdirs>=4.3.8" pygments==2.19.2 "python-dateutil==2.9.0.post0" pyyaml==6.0.2 "rich>=14.0.0" setproctitle==1.3.6 typer-slim==0.16.0 valkey==6.1.0 whitenoise==6.9.0 "waitress>=3.0.2" fasttext-predict==0.9.2.4
          # --no-deps prevents pip from pulling simplexng's uvloop (Unix-only, no
          # Windows wheel), which would fail the whole `pip install .` and silently
          # drop openai-codex from the frozen build.
          pip install . --no-deps
          pip install -r build/requirements-windows-release.txt
          pip install openai-codex==0.144.4 --no-deps
          # Upgrade pydantic first, then install mcp and friends to avoid pip uninstalling mcp
          # when resolving pyproject.toml dependencies (mcp 1.28+ requires pydantic>=2.11.0).
          pip install --upgrade typing_extensions pydantic pydantic_core
          pip install mcp httpx-sse pydantic pydantic-settings jsonschema referencing rpds-py attrs sse-starlette pyjwt
          # OpenCV is NOT bundled (spec excludes cv2; OCR downloads the full
          # wheel on demand via cyrene.plugins.builtin.cyrene_knowledge.opencv_runtime). The
          # headless wheel avoids GUI system deps in the build environment.
          pip uninstall -y opencv-python
          pip install opencv-python-headless
          python build/check_windows_dependencies.py

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Test Windows App Use provider
        id: windows_app_use
        continue-on-error: true
        shell: powershell
        run: |
          node --test electron/app-use.test.js
          $json = @{ operation = 'list_targets'; excludePid = 0; excludeApplicationIds = @(); excludeAppNames = @() } | ConvertTo-Json -Compress
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron\app-use-windows.ps1 -PayloadBase64 $payload
          $result = @($raw)[-1] | ConvertFrom-Json
          if ($result.ok -ne $true) { throw "Windows App Use provider smoke test failed: $(@($raw) -join [Environment]::NewLine)" }

      - name: Build WebUI JS
        run: cd src/cyrene/workbench/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Apply Windows compatibility patches
        shell: python
        run: |
          import os, sys, site

          import simplexng
          sx = simplexng.__path__[0]
          print(f"simplexng at: {sx}")

          # 1. Replace uvloop with winloop
          client_py = os.path.join(sx, "_vendor", "searx", "network", "client.py")
          if os.path.exists(client_py):
              with open(client_py, "r") as f:
                  content = f.read()
              content = content.replace(
                  'import uvloop\n',
                  'import sys\nif sys.platform == "win32":\n    import winloop as uvloop\nelse:\n    import uvloop\n'
              )
              if "winloop" not in content:
                  raise SystemExit(
                      "FATAL: uvloop->winloop patch did not match searx client.py; "
                      "the Windows build would ship a broken simplexng"
                  )
              with open(client_py, "w") as f:
                  f.write(content)
              print("Patched uvloop -> winloop")
          else:
              print(f"WARNING: {client_py} not found")

          # 2. Replace fork with spawn
          calc_py = os.path.join(sx, "_vendor", "searx", "plugins", "calculator.py")
          if os.path.exists(calc_py):
              with open(calc_py, "r") as f:
                  content = f.read()
              content = content.replace(
                  'mp_fork = multiprocessing.get_context("fork")',
                  'mp_fork = multiprocessing.get_context("fork" if sys.platform != "win32" else "spawn")'
              )
              with open(calc_py, "w") as f:
                  f.write(content)
              print("Patched fork -> spawn")
          else:
              print(f"WARNING: {calc_py} not found")

          # 3. Create pwd stub
          site_pkg = site.getsitepackages()[0]
          pwd_py = os.path.join(site_pkg, "pwd.py")
          with open(pwd_py, "w") as f:
              f.write('''"""pwd stub for Windows - SearXNG compatibility."""
          import os
          def getpwuid(uid):
              name = os.environ.get("USERNAME", "unknown")
              return type("pw", (), {"pw_name": name, "pw_uid": uid})()
          ''')
          print(f"Created pwd stub at {pwd_py}")

          # 4. Enable JSON API in SearXNG settings
          settings_yml = os.path.join(sx, "settings", "settings_template.yml")
          if os.path.exists(settings_yml):
              with open(settings_yml, "r") as f:
                  content = f.read()
              if "formats:" in content and "json" not in content.split("formats:", 1)[1].split("\n\n", 1)[0]:
                  content = content.replace(
                      "formats:\n    - html",
                      "formats:\n    - html\n    - json"
                  )
                  with open(settings_yml, "w") as f:
                      f.write(content)
                  print("Enabled JSON API in SearXNG settings")
          else:
              print(f"WARNING: {settings_yml} not found")

          print("Windows compatibility patches applied.")

      - name: Verify build environment imports
        run: |
          python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, croniter, jinja2, websockets, simplexng, mcp, google.genai, numpy, numpy._core._multiarray_umath, openai_codex; print('imports-ok')"

      - name: Benchmark sustained Windows ConPTY output
        id: windows_conpty_benchmark
        continue-on-error: true
        shell: powershell
        run: |
          $report = "output/performance/terminal-real-windows-x64.json"
          python -m cyrene.observability.terminal_performance_benchmark `
            --bytes 5242880 `
            --output-limit 4194304 `
            --json $report `
            --fail-on-quality

      - name: Upload Windows ConPTY benchmark
        if: ${{ always() && steps.windows_conpty_benchmark.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-performance-windows-x64
          path: output/performance/terminal-real-windows-x64.json
          if-no-files-found: error

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py

      - name: Install and smoke test Windows package
        id: windows_package_smoke
        continue-on-error: true
        shell: powershell
        run: build\windows-release-smoke.ps1 -Arch x64

      - name: Upload Windows packages
        id: windows_package_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist-electron/Cyrene-*-win-x64.exe
            dist-electron/Cyrene-*-win-x64-portable.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish Windows x64 packages
        id: windows_package_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.windows_package_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-win-x64.exe dist-electron/Cyrene-*-win-x64-portable.exe --clobber

      - name: Report all Windows x64 validation failures
        if: always()
        shell: bash
        env:
          APP_USE_OUTCOME: ${{ steps.windows_app_use.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.windows_conpty_benchmark.outcome }}
          PACKAGE_SMOKE_OUTCOME: ${{ steps.windows_package_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.windows_package_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.windows_package_publish.outcome }}
        run: |
          failures=()
          test "$APP_USE_OUTCOME" = success || failures+=("Windows App Use: $APP_USE_OUTCOME")
          test "$BENCHMARK_OUTCOME" = success || failures+=("ConPTY benchmark: $BENCHMARK_OUTCOME")
          test "$PACKAGE_SMOKE_OUTCOME" = success || failures+=("package smoke matrix: $PACKAGE_SMOKE_OUTCOME")
          test "$ARTIFACT_OUTCOME" = success || failures+=("package artifact upload: $ARTIFACT_OUTCOME")
          test "$PUBLISH_OUTCOME" = success || test "$PUBLISH_OUTCOME" = skipped || failures+=("GitHub release upload: $PUBLISH_OUTCOME")
          if ((${#failures[@]})); then
            printf 'Windows x64 pre-release validation failures (%s):\n' "${#failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

  # ==========================================================================
  # Windows on ARM Build
  # ==========================================================================
  build-windows-arm-sidecars:
    if: ${{ inputs.platforms != 'windows-x64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup x64 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install x64 compatibility dependencies
        run: |
          pip install "pyinstaller>=6.0" rapidocr onnxruntime-directml opencv-python-headless pyclipper pillow numpy
          pip install winloop simplexng --no-deps
          pip install babel==2.17.0 brotli==1.1.0 "clideps>=0.1.6" flask==3.1.1 flask-babel==4.0.0 "httpx-socks[asyncio]==0.10.0" isodate==0.7.2 lxml==6.0.0 markdown-it-py==3.0.0 msgspec==0.19.0 "platformdirs>=4.3.8" pygments==2.19.2 "python-dateutil==2.9.0.post0" pyyaml==6.0.2 "rich>=14.0.0" setproctitle==1.3.6 typer-slim==0.16.0 valkey==6.1.0 whitenoise==6.9.0 "waitress>=3.0.2" fasttext-predict==0.9.2.4
      - name: Build x64 compatibility sidecars
        run: python build/build.py --woa-x64-sidecars-only
      - name: Smoke test x64 compatibility sidecars
        shell: powershell
        run: |
          $failures = [Collections.Generic.List[string]]::new()
          try {
            $ocr = & dist\x64-sidecars\ocr\CyreneOcr.exe --smoke-test
            if ($ocr -notmatch "CYRENE_OCR_SIDECAR_SMOKE=ok") { throw "unexpected output: $ocr" }
          } catch { $failures.Add("OCR sidecar: $($_ | Out-String)") }
          try {
            $search = & dist\x64-sidecars\simplexng\CyreneSimpleXNG.exe --smoke-test
            if ($search -notmatch "CYRENE_SIMPLEXNG_SIDECAR_SMOKE=ok") { throw "unexpected output: $search" }
          } catch { $failures.Add("SimpleXNG sidecar: $($_ | Out-String)") }
          if ($failures.Count -gt 0) {
            throw "WoA sidecar validation failures ($($failures.Count)):`n$($failures -join "`n")"
          }
      - name: Upload WoA x64 sidecars
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm-x64-sidecars
          path: dist/x64-sidecars
          if-no-files-found: error

  build-windows-arm:
    needs: [release, build-windows-arm-sidecars]
    if: ${{ inputs.platforms != 'windows-x64' }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download x64 compatibility sidecars
        uses: actions/download-artifact@v8
        with:
          name: windows-arm-x64-sidecars
          path: build/woa-x64-sidecars

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/cyrene/workbench/webui/package-lock.json

      - name: Install Python deps
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "pyinstaller>=6.0" pillow packaging pypdf reportlab
          pip install pybind11 setuptools wheel
          pip install aiosqlite anyio apscheduler croniter fastapi "httpx[http2]==0.28.1" "jinja2==3.1.6" python-dotenv python-telegram-bot requests sniffio watchfiles websockets python-multipart certifi==2025.7.14 h11 idna
          pip install winloop "pyte>=0.8.2" pywinpty==3.0.5
          pip install . --no-deps
          pip install openai-codex==0.144.4 --no-deps
          pip install pyyaml "prompt-toolkit>=3.0.52" "rich>=15.0.0"
          pip install --upgrade typing_extensions pydantic pydantic_core
          pip install keyring uvicorn

      - name: Build native ARM64 cryptography runtime
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add aarch64-pc-windows-msvc
          vcpkg install openssl:arm64-windows-static-md
          $env:OPENSSL_DIR = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\arm64-windows-static-md"
          $env:OPENSSL_STATIC = "1"
          python -m pip install --force-reinstall --no-deps --no-binary cffi cffi
          python -c "import _cffi_backend; print('arm64-cffi-ok')"
          python -m pip install --force-reinstall --no-deps --no-binary cryptography cryptography
          python -c "import platform; from cryptography.fernet import Fernet; assert platform.machine().lower() in {'arm64','aarch64'}; Fernet(Fernet.generate_key()); print('arm64-cryptography-ok')"
          python -m pip install -r build/requirements-windows-release.txt

      - name: Install MCP runtime
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Install MCP only after the native ARM64 cryptography module is usable.
          pip install mcp httpx-sse pydantic pydantic-settings jsonschema referencing rpds-py attrs sse-starlette pyjwt
          python build/check_windows_dependencies.py

      - name: Install native ARM64 VC runtime
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "ARM64 VC runtime installer exited with code $($process.ExitCode)"
          }
          # Microsoft's ARM64 redistributable ships this runtime as ARM64X. A
          # final ARM64X DLL may carry either the AMD64 or ARM64 PE machine value.
          python -c "from pathlib import Path; import os, struct; p=Path(os.environ['SystemRoot'])/'System32'/'vcruntime140_1.dll'; f=p.open('rb'); f.seek(0x3c); o=struct.unpack('<I',f.read(4))[0]; f.seek(o+4); m=struct.unpack('<H',f.read(2))[0]; f.close(); assert m in {0x8664,0xaa64}, hex(m); print(f'arm64x-vc-runtime-ok: {p} ({hex(m)})')"

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Test Windows App Use provider
        id: windows_arm_app_use
        continue-on-error: true
        shell: powershell
        run: |
          node --test electron/app-use.test.js
          $json = @{ operation = 'list_targets'; excludePid = 0; excludeApplicationIds = @(); excludeAppNames = @() } | ConvertTo-Json -Compress
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron\app-use-windows.ps1 -PayloadBase64 $payload
          $result = @($raw)[-1] | ConvertFrom-Json
          if ($result.ok -ne $true) { throw "Windows App Use provider smoke test failed: $(@($raw) -join [Environment]::NewLine)" }

      - name: Build WebUI JS
        run: cd src/cyrene/workbench/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify build environment imports
        run: |
          python -c "import platform; from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, croniter, jinja2, websockets, mcp, google.genai, numpy, numpy._core._multiarray_umath, onnxruntime, onnxruntime_qnn, openai_codex; assert platform.machine().lower() in {'arm64','aarch64'}; print('arm64-imports-ok')"

      - name: Benchmark sustained Windows ConPTY output
        id: windows_arm_conpty_benchmark
        continue-on-error: true
        shell: powershell
        run: |
          $report = "output/performance/terminal-real-windows-arm64.json"
          python -m cyrene.observability.terminal_performance_benchmark `
            --bytes 1048576 `
            --output-limit 786432 `
            --json $report `
            --fail-on-quality

      - name: Upload Windows ARM64 ConPTY benchmark
        if: ${{ always() && steps.windows_arm_conpty_benchmark.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-performance-windows-arm64
          path: output/performance/terminal-real-windows-arm64.json
          if-no-files-found: error

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py --arch arm64

      - name: Install and smoke test Windows package
        id: windows_arm_package_smoke
        continue-on-error: true
        shell: powershell
        run: build\windows-release-smoke.ps1 -Arch arm64

      - name: Upload Windows packages
        id: windows_arm_package_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-arm
          path: |
            dist-electron/Cyrene-*-win-arm64.exe
            dist-electron/Cyrene-*-win-arm64-portable.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish Windows ARM64 packages
        id: windows_arm_package_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.windows_arm_package_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-win-arm64.exe dist-electron/Cyrene-*-win-arm64-portable.exe --clobber

      - name: Report all Windows ARM64 validation failures
        if: always()
        shell: bash
        env:
          APP_USE_OUTCOME: ${{ steps.windows_arm_app_use.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.windows_arm_conpty_benchmark.outcome }}
          PACKAGE_SMOKE_OUTCOME: ${{ steps.windows_arm_package_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.windows_arm_package_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.windows_arm_package_publish.outcome }}
        run: |
          failures=()
          test "$APP_USE_OUTCOME" = success || failures+=("Windows App Use: $APP_USE_OUTCOME")
          test "$BENCHMARK_OUTCOME" = success || failures+=("ConPTY benchmark: $BENCHMARK_OUTCOME")
          test "$PACKAGE_SMOKE_OUTCOME" = success || failures+=("package smoke matrix: $PACKAGE_SMOKE_OUTCOME")
          test "$ARTIFACT_OUTCOME" = success || failures+=("package artifact upload: $ARTIFACT_OUTCOME")
          test "$PUBLISH_OUTCOME" = success || test "$PUBLISH_OUTCOME" = skipped || failures+=("GitHub release upload: $PUBLISH_OUTCOME")
          if ((${#failures[@]})); then
            printf 'Windows ARM64 pre-release validation failures (%s):\n' "${#failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

  # ==========================================================================
  # Linux Build
  # ==========================================================================
  build-linux:
    needs: [release]
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/cyrene/workbench/webui/package-lock.json

      # No system deps needed — Electron handles the window on all platforms.
      # No appimagetool needed — electron-builder produces AppImage.

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging
          pip install .
          pip install --upgrade typing_extensions pydantic pydantic_core
          # OpenCV is NOT bundled (spec excludes cv2; OCR downloads the full
          # wheel on demand via cyrene.plugins.builtin.cyrene_knowledge.opencv_runtime). The
          # headless wheel avoids GUI system deps in the build environment.
          pip uninstall -y opencv-python
          pip install opencv-python-headless

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Build WebUI JS
        run: cd src/cyrene/workbench/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify build environment imports
        run: |
          python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, websockets, simplexng, jinja2, mcp, google.genai, onnxruntime, openai_codex; assert onnxruntime.__version__.startswith('1.26.'); assert 'CPUExecutionProvider' in onnxruntime.get_available_providers(); print('imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py

      - name: Smoke test packaged Python app
        id: linux_python_smoke
        continue-on-error: true
        run: ./dist/Cyrene/Cyrene --smoke-test

      - name: Smoke test packaged AppImage UI
        id: linux_appimage_smoke
        continue-on-error: true
        env:
          CYRENE_USER_DATA_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/data
          CYRENE_CACHE_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/cache
          CYRENE_TEMP_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/tmp
        run: |
          timeout 180s xvfb-run -a \
            dist-electron/Cyrene-*-x64.AppImage \
            --appimage-extract-and-run \
            --no-sandbox \
            --desktop-smoke-test

      - name: Publish Linux AppImage
        id: linux_appimage_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.linux_appimage_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-x64.AppImage --clobber

      - name: Install and smoke test Debian package
        id: linux_deb_smoke
        continue-on-error: true
        env:
          CYRENE_USER_DATA_DIR: ${{ runner.temp }}/cyrene-deb-smoke/data
          CYRENE_CACHE_DIR: ${{ runner.temp }}/cyrene-deb-smoke/cache
          CYRENE_TEMP_DIR: ${{ runner.temp }}/cyrene-deb-smoke/tmp
        run: |
          sudo apt-get install -y ./dist-electron/Cyrene-*-x64.deb
          test "$(stat -c '%u:%a' /opt/Cyrene/chrome-sandbox)" = "0:4755"
          mkdir -p "$CYRENE_USER_DATA_DIR/data"
          printf '%s' 'unreadable-config-without-local-key' \
            > "$CYRENE_USER_DATA_DIR/data/config.enc"
          timeout 180s xvfb-run -a \
            /opt/Cyrene/cyrene \
            --desktop-smoke-test
          test -f "$CYRENE_USER_DATA_DIR/data/config.enc.missing-key.bak"
          test -f "$CYRENE_USER_DATA_DIR/data/.config_key"

      - name: Publish Linux Debian package
        id: linux_deb_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.linux_deb_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-x64.deb --clobber

      - name: Install and smoke test RPM package
        id: linux_rpm_smoke
        continue-on-error: true
        run: |
          docker run --rm \
            --shm-size=1g \
            -v "$PWD:/workspace:ro" \
            fedora:latest \
            bash /workspace/build/linux-rpm-release-smoke.sh

      - name: Publish Linux RPM package
        id: linux_rpm_publish
        continue-on-error: true
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.linux_rpm_smoke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-electron/Cyrene-*-x64.rpm --clobber

      - name: Upload Linux packages
        id: linux_package_artifact
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist-electron/Cyrene-*-x64.AppImage
            dist-electron/Cyrene-*-x64.deb
            dist-electron/Cyrene-*-x64.rpm
          if-no-files-found: error
          compression-level: 0

      - name: Report all Linux validation failures
        if: always()
        shell: bash
        env:
          PYTHON_SMOKE_OUTCOME: ${{ steps.linux_python_smoke.outcome }}
          APPIMAGE_SMOKE_OUTCOME: ${{ steps.linux_appimage_smoke.outcome }}
          DEB_SMOKE_OUTCOME: ${{ steps.linux_deb_smoke.outcome }}
          RPM_SMOKE_OUTCOME: ${{ steps.linux_rpm_smoke.outcome }}
          APPIMAGE_PUBLISH_OUTCOME: ${{ steps.linux_appimage_publish.outcome }}
          DEB_PUBLISH_OUTCOME: ${{ steps.linux_deb_publish.outcome }}
          RPM_PUBLISH_OUTCOME: ${{ steps.linux_rpm_publish.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.linux_package_artifact.outcome }}
        run: |
          failures=()
          test "$PYTHON_SMOKE_OUTCOME" = success || failures+=("packaged Python: $PYTHON_SMOKE_OUTCOME")
          test "$APPIMAGE_SMOKE_OUTCOME" = success || failures+=("AppImage UI: $APPIMAGE_SMOKE_OUTCOME")
          test "$DEB_SMOKE_OUTCOME" = success || failures+=("Debian package: $DEB_SMOKE_OUTCOME")
          test "$RPM_SMOKE_OUTCOME" = success || failures+=("RPM package: $RPM_SMOKE_OUTCOME")
          test "$APPIMAGE_PUBLISH_OUTCOME" = success || test "$APPIMAGE_PUBLISH_OUTCOME" = skipped || failures+=("AppImage release upload: $APPIMAGE_PUBLISH_OUTCOME")
          test "$DEB_PUBLISH_OUTCOME" = success || test "$DEB_PUBLISH_OUTCOME" = skipped || failures+=("Debian release upload: $DEB_PUBLISH_OUTCOME")
          test "$RPM_PUBLISH_OUTCOME" = success || test "$RPM_PUBLISH_OUTCOME" = skipped || failures+=("RPM release upload: $RPM_PUBLISH_OUTCOME")
          test "$ARTIFACT_OUTCOME" = success || failures+=("Linux artifact upload: $ARTIFACT_OUTCOME")
          if ((${#failures[@]})); then
            printf 'Linux pre-release validation failures (%s):\n' "${#failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

  # ==========================================================================
  # Create the release before builds begin. Each platform publishes its own
  # verified assets as soon as they are ready, so one failed platform does not
  # block successful installers from becoming available.
  # ==========================================================================
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag, version, main ancestry, and CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          electron_version="$(node -p "require('./electron/package.json').version")"
          changelog_version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)"
          test "$version" = "$python_version"
          test "$version" = "$electron_version"
          test "$version" = "$changelog_version"

          git fetch --deepen=20 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

          echo "release ancestry verified"

          ci_sha="$(
            git log -20 --format='%H %s' \
            | awk '!found && $0 !~ /\[skip ci\]/{print $1; found=1}'
          )"
          test -n "$ci_sha"
          echo "CI candidate: $ci_sha"
          ci_conclusion="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${ci_sha}/check-runs?per_page=100" \
            | jq -r '
                .check_runs as $runs
                | [
                    "Python / locked contracts",
                    "WebUI build / Electron tests"
                  ]
                | all(. as $required
                    | any($runs[];
                        .name == $required
                        and .conclusion == "success"))
              '
          )"
          echo "CI conclusion: ${ci_conclusion:-missing}"
          test "$ci_conclusion" = "true"

      - name: Detect pre-release
        if: startsWith(github.ref, 'refs/tags/')
        id: pre
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(alpha|beta|[0-9]b[0-9]|rc)'; then
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          # Extract the first "## [...]" section from CHANGELOG.md
          {
            echo "body<<CHANGELOG_EOF"
            awk '/^## \[/{n++} n==1{print} n>=2{exit}' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ steps.pre.outputs.is_pre == 'true' }}

  pre-release-summary:
    needs:
      - release
      - build-macos
      - build-windows
      - build-windows-arm-sidecars
      - build-windows-arm
      - build-linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report every platform result
        shell: bash
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_X64_RESULT: ${{ needs.build-windows.result }}
          WINDOWS_SIDECARS_RESULT: ${{ needs.build-windows-arm-sidecars.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.build-windows-arm.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          failures=()
          for entry in \
            "release gate:$RELEASE_RESULT" \
            "macOS:$MACOS_RESULT" \
            "Windows x64:$WINDOWS_X64_RESULT" \
            "Windows ARM64 sidecars:$WINDOWS_SIDECARS_RESULT" \
            "Windows ARM64:$WINDOWS_ARM64_RESULT" \
            "Linux:$LINUX_RESULT"
          do
            label="${entry%%:*}"
            result="${entry#*:}"
            printf '%-26s %s\n' "$label" "$result"
            test "$result" = failure || test "$result" = cancelled || continue
            failures+=("$label: $result")
          done
          if ((${#failures[@]})); then
            printf 'Pre-release failures across all platforms (%s):\n' "${#failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
