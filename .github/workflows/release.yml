name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ui_mode:
        description: "Compatibility build mode (agent is normalized to the sole Workbench UI)"
        required: false
        default: "workbench"
        type: choice
        options:
          - workbench
          - agent

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UI_MODE: ${{ inputs.ui_mode || 'workbench' }}

jobs:
  # ==========================================================================
  # macOS Build
  # ==========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/webui/package-lock.json

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging
          pip install .
          pip install --upgrade typing_extensions pydantic pydantic_core

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Build WebUI JS
        run: cd src/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify critical imports
        run: python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; print('imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py --ui-mode ${{ env.UI_MODE }}

      - name: Install and smoke test macOS package
        run: build/macos-release-smoke.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist-electron/Cyrene-*-mac.dmg
          if-no-files-found: error
          compression-level: 0

  # ==========================================================================
  # Windows Build
  # ==========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/webui/package-lock.json

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging pypdf reportlab
          pip install pybind11 setuptools wheel
          pip install aiosqlite anyio apscheduler croniter fastapi "httpx[http2]==0.28.1" "jinja2==3.1.6" python-dotenv python-telegram-bot requests sniffio websockets python-multipart certifi==2025.7.14 h11 idna
          pip install winloop
          # simplexng and its transitive deps (it uses --no-deps so we list them explicitly)
          pip install simplexng --no-deps
          pip install babel==2.17.0 brotli==1.1.0 "clideps>=0.1.6" flask==3.1.1 flask-babel==4.0.0 "httpx-socks[asyncio]==0.10.0" isodate==0.7.2 lxml==6.0.0 markdown-it-py==3.0.0 msgspec==0.19.0 "platformdirs>=4.3.8" pygments==2.19.2 "python-dateutil==2.9.0.post0" pyyaml==6.0.2 "rich>=14.0.0" setproctitle==1.3.6 typer-slim==0.16.0 valkey==6.1.0 whitenoise==6.9.0 "waitress>=3.0.2" fasttext-predict==0.9.2.4
          # --no-deps prevents pip from pulling simplexng's uvloop (Unix-only, no
          # Windows wheel), which would fail the whole `pip install .` and silently
          # drop openai-codex from the frozen build.
          pip install . --no-deps
          pip install -r build/requirements-windows-release.txt
          pip install openai-codex==0.144.4
          # Upgrade pydantic first, then install mcp and friends to avoid pip uninstalling mcp
          # when resolving pyproject.toml dependencies (mcp 1.28+ requires pydantic>=2.11.0).
          pip install --upgrade typing_extensions pydantic pydantic_core
          pip install mcp httpx-sse pydantic pydantic-settings jsonschema referencing rpds-py attrs sse-starlette pyjwt
          python build/check_windows_dependencies.py

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Test Windows App Use provider
        shell: powershell
        run: |
          node --test electron/app-use.test.js
          $json = @{ operation = 'list_targets'; excludePid = 0; excludeApplicationIds = @(); excludeAppNames = @() } | ConvertTo-Json -Compress
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron\app-use-windows.ps1 -PayloadBase64 $payload
          $result = @($raw)[-1] | ConvertFrom-Json
          if ($result.ok -ne $true) { throw "Windows App Use provider smoke test failed: $(@($raw) -join [Environment]::NewLine)" }

      - name: Build WebUI JS
        run: cd src/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Apply Windows compatibility patches
        shell: python
        run: |
          import os, sys, site

          import simplexng
          sx = simplexng.__path__[0]
          print(f"simplexng at: {sx}")

          # 1. Replace uvloop with winloop
          client_py = os.path.join(sx, "_vendor", "searx", "network", "client.py")
          if os.path.exists(client_py):
              with open(client_py, "r") as f:
                  content = f.read()
              content = content.replace(
                  'import uvloop\n',
                  'import sys\nif sys.platform == "win32":\n    import winloop as uvloop\nelse:\n    import uvloop\n'
              )
              if "winloop" not in content:
                  raise SystemExit(
                      "FATAL: uvloop->winloop patch did not match searx client.py; "
                      "the Windows build would ship a broken simplexng"
                  )
              with open(client_py, "w") as f:
                  f.write(content)
              print("Patched uvloop -> winloop")
          else:
              print(f"WARNING: {client_py} not found")

          # 2. Replace fork with spawn
          calc_py = os.path.join(sx, "_vendor", "searx", "plugins", "calculator.py")
          if os.path.exists(calc_py):
              with open(calc_py, "r") as f:
                  content = f.read()
              content = content.replace(
                  'mp_fork = multiprocessing.get_context("fork")',
                  'mp_fork = multiprocessing.get_context("fork" if sys.platform != "win32" else "spawn")'
              )
              with open(calc_py, "w") as f:
                  f.write(content)
              print("Patched fork -> spawn")
          else:
              print(f"WARNING: {calc_py} not found")

          # 3. Create pwd stub
          site_pkg = site.getsitepackages()[0]
          pwd_py = os.path.join(site_pkg, "pwd.py")
          with open(pwd_py, "w") as f:
              f.write('''"""pwd stub for Windows - SearXNG compatibility."""
          import os
          def getpwuid(uid):
              name = os.environ.get("USERNAME", "unknown")
              return type("pw", (), {"pw_name": name, "pw_uid": uid})()
          ''')
          print(f"Created pwd stub at {pwd_py}")

          # 4. Enable JSON API in SearXNG settings
          settings_yml = os.path.join(sx, "settings", "settings_template.yml")
          if os.path.exists(settings_yml):
              with open(settings_yml, "r") as f:
                  content = f.read()
              if "formats:" in content and "json" not in content.split("formats:", 1)[1].split("\n\n", 1)[0]:
                  content = content.replace(
                      "formats:\n    - html",
                      "formats:\n    - html\n    - json"
                  )
                  with open(settings_yml, "w") as f:
                      f.write(content)
                  print("Enabled JSON API in SearXNG settings")
          else:
              print(f"WARNING: {settings_yml} not found")

          print("Windows compatibility patches applied.")

      - name: Verify build environment imports
        run: |
          python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, croniter, jinja2, websockets, simplexng, mcp, numpy, numpy._core._multiarray_umath, openai_codex, codex_cli_bin; print('imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py --ui-mode ${{ env.UI_MODE }}

      - name: Install and smoke test Windows package
        shell: powershell
        run: build\windows-release-smoke.ps1 -Arch x64

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist-electron/Cyrene-*-win-x64.exe
            dist-electron/Cyrene-*-win-x64-portable.exe
          if-no-files-found: error
          compression-level: 0

  # ==========================================================================
  # Windows on ARM Build
  # ==========================================================================
  build-windows-arm-sidecars:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup x64 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install x64 compatibility dependencies
        run: |
          pip install "pyinstaller>=6.0" rapidocr onnxruntime-directml opencv-python pyclipper pillow numpy
          pip install winloop simplexng --no-deps
          pip install babel==2.17.0 brotli==1.1.0 "clideps>=0.1.6" flask==3.1.1 flask-babel==4.0.0 "httpx-socks[asyncio]==0.10.0" isodate==0.7.2 lxml==6.0.0 markdown-it-py==3.0.0 msgspec==0.19.0 "platformdirs>=4.3.8" pygments==2.19.2 "python-dateutil==2.9.0.post0" pyyaml==6.0.2 "rich>=14.0.0" setproctitle==1.3.6 typer-slim==0.16.0 valkey==6.1.0 whitenoise==6.9.0 "waitress>=3.0.2" fasttext-predict==0.9.2.4
      - name: Build x64 compatibility sidecars
        run: python build/build.py --woa-x64-sidecars-only
      - name: Smoke test x64 compatibility sidecars
        shell: powershell
        run: |
          $ocr = & dist\x64-sidecars\ocr\CyreneOcr.exe --smoke-test
          if ($ocr -notmatch "CYRENE_OCR_SIDECAR_SMOKE=ok") { throw "OCR sidecar smoke test failed: $ocr" }
          $search = & dist\x64-sidecars\simplexng\CyreneSimpleXNG.exe --smoke-test
          if ($search -notmatch "CYRENE_SIMPLEXNG_SIDECAR_SMOKE=ok") { throw "SimpleXNG sidecar smoke test failed: $search" }
      - name: Upload WoA x64 sidecars
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm-x64-sidecars
          path: dist/x64-sidecars
          if-no-files-found: error

  build-windows-arm:
    needs: [build-windows-arm-sidecars]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download x64 compatibility sidecars
        uses: actions/download-artifact@v8
        with:
          name: windows-arm-x64-sidecars
          path: build/woa-x64-sidecars

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/webui/package-lock.json

      - name: Install Python deps
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "pyinstaller>=6.0" pillow packaging pypdf reportlab
          pip install pybind11 setuptools wheel
          pip install aiosqlite anyio apscheduler croniter fastapi "httpx[http2]==0.28.1" "jinja2==3.1.6" python-dotenv python-telegram-bot requests sniffio websockets python-multipart certifi==2025.7.14 h11 idna
          pip install winloop
          pip install . --no-deps
          pip install -r build/requirements-windows-release.txt
          pip install openai-codex==0.144.4
          pip install pyyaml "prompt-toolkit>=3.0.52" "rich>=15.0.0"
          pip install --upgrade typing_extensions pydantic pydantic_core
          pip install keyring uvicorn

      - name: Build native ARM64 cryptography runtime
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add aarch64-pc-windows-msvc
          vcpkg install openssl:arm64-windows-static-md
          $env:OPENSSL_DIR = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\arm64-windows-static-md"
          $env:OPENSSL_STATIC = "1"
          python -m pip install --force-reinstall --no-deps --no-binary cryptography cryptography
          python -c "import platform; from cryptography.fernet import Fernet; assert platform.machine().lower() in {'arm64','aarch64'}; Fernet(Fernet.generate_key()); print('arm64-cryptography-ok')"

      - name: Install MCP runtime
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Install MCP only after the native ARM64 cryptography module is usable.
          pip install mcp httpx-sse pydantic pydantic-settings jsonschema referencing rpds-py attrs sse-starlette pyjwt
          python build/check_windows_dependencies.py

      - name: Install native ARM64 VC runtime
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "ARM64 VC runtime installer exited with code $($process.ExitCode)"
          }
          # Microsoft's ARM64 redistributable ships this runtime as ARM64X. A
          # final ARM64X DLL may carry either the AMD64 or ARM64 PE machine value.
          python -c "from pathlib import Path; import os, struct; p=Path(os.environ['SystemRoot'])/'System32'/'vcruntime140_1.dll'; f=p.open('rb'); f.seek(0x3c); o=struct.unpack('<I',f.read(4))[0]; f.seek(o+4); m=struct.unpack('<H',f.read(2))[0]; f.close(); assert m in {0x8664,0xaa64}, hex(m); print(f'arm64x-vc-runtime-ok: {p} ({hex(m)})')"

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Test Windows App Use provider
        shell: powershell
        run: |
          node --test electron/app-use.test.js
          $json = @{ operation = 'list_targets'; excludePid = 0; excludeApplicationIds = @(); excludeAppNames = @() } | ConvertTo-Json -Compress
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron\app-use-windows.ps1 -PayloadBase64 $payload
          $result = @($raw)[-1] | ConvertFrom-Json
          if ($result.ok -ne $true) { throw "Windows App Use provider smoke test failed: $(@($raw) -join [Environment]::NewLine)" }

      - name: Build WebUI JS
        run: cd src/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify build environment imports
        run: |
          python -c "import platform; from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, croniter, jinja2, websockets, mcp, numpy, numpy._core._multiarray_umath, onnxruntime, onnxruntime_qnn, openai_codex, codex_cli_bin; assert platform.machine().lower() in {'arm64','aarch64'}; print('arm64-imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py --ui-mode ${{ env.UI_MODE }} --arch arm64

      - name: Install and smoke test Windows package
        shell: powershell
        run: build\windows-release-smoke.ps1 -Arch arm64

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-arm
          path: |
            dist-electron/Cyrene-*-win-arm64.exe
            dist-electron/Cyrene-*-win-arm64-portable.exe
          if-no-files-found: error
          compression-level: 0

  # ==========================================================================
  # Linux Build
  # ==========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: |
            electron/package-lock.json
            src/webui/package-lock.json

      # No system deps needed — Electron handles the window on all platforms.
      # No appimagetool needed — electron-builder produces AppImage.

      - name: Install Python deps
        run: |
          pip install "pyinstaller>=6.0" pillow packaging
          pip install .
          pip install --upgrade typing_extensions pydantic pydantic_core

      - name: Install Electron deps
        run: cd electron && npm ci --prefer-offline --no-audit --no-fund

      - name: Build WebUI JS
        run: cd src/webui && npm ci --prefer-offline --no-audit --no-fund && node build-jsx.mjs

      - name: Verify build environment imports
        run: |
          python -c "from typing_extensions import Sentinel; from pydantic_core import core_schema; import anyio, httpx, httpcore, sniffio, aiosqlite, apscheduler, websockets, simplexng, jinja2, mcp, onnxruntime, openai_codex, codex_cli_bin; assert onnxruntime.__version__.startswith('1.26.'); assert 'CPUExecutionProvider' in onnxruntime.get_available_providers(); print('imports-ok')"

      - name: Full build (PyInstaller + Electron)
        run: python build/build.py --ui-mode ${{ env.UI_MODE }}

      - name: Smoke test packaged Python app
        run: ./dist/Cyrene/Cyrene --smoke-test

      - name: Smoke test packaged AppImage UI
        env:
          CYRENE_USER_DATA_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/data
          CYRENE_CACHE_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/cache
          CYRENE_TEMP_DIR: ${{ runner.temp }}/cyrene-desktop-smoke/tmp
        run: |
          timeout 180s xvfb-run -a \
            dist-electron/Cyrene-*-x64.AppImage \
            --appimage-extract-and-run \
            --no-sandbox \
            --desktop-smoke-test

      - name: Install and smoke test Debian package
        env:
          CYRENE_USER_DATA_DIR: ${{ runner.temp }}/cyrene-deb-smoke/data
          CYRENE_CACHE_DIR: ${{ runner.temp }}/cyrene-deb-smoke/cache
          CYRENE_TEMP_DIR: ${{ runner.temp }}/cyrene-deb-smoke/tmp
        run: |
          sudo apt-get install -y ./dist-electron/Cyrene-*-x64.deb
          test "$(stat -c '%u:%a' /opt/Cyrene/chrome-sandbox)" = "0:4755"
          mkdir -p "$CYRENE_USER_DATA_DIR/data"
          printf '%s' 'unreadable-config-without-local-key' \
            > "$CYRENE_USER_DATA_DIR/data/config.enc"
          timeout 180s xvfb-run -a \
            /opt/Cyrene/cyrene \
            --desktop-smoke-test
          test -f "$CYRENE_USER_DATA_DIR/data/config.enc.missing-key.bak"
          test -f "$CYRENE_USER_DATA_DIR/data/.config_key"

      - name: Install and smoke test RPM package
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            fedora:latest \
            bash /workspace/build/linux-rpm-release-smoke.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist-electron/Cyrene-*-x64.AppImage
            dist-electron/Cyrene-*-x64.deb
            dist-electron/Cyrene-*-x64.rpm
          if-no-files-found: error
          compression-level: 0

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    # Do not publish until every installer offered by the release has been
    # installed and launched successfully on its native platform.
    needs: [build-macos, build-windows, build-windows-arm, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: artifacts

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer-arm
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Delete existing assets on current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not running on a tag; skipping asset cleanup."
            exit 0
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done

      - name: Detect pre-release
        id: pre
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(alpha|beta|[0-9]b[0-9]|rc)'; then
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: notes
        run: |
          # Extract the first "## [...]" section from CHANGELOG.md
          {
            echo "body<<CHANGELOG_EOF"
            awk '/^## \[/{n++} n==1{print} n>=2{exit}' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.pre.outputs.is_pre == 'true' }}
