<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>远程桌面</title>
  <style>
    :root { color-scheme:light dark; --accent:#1f9d76; --danger:#d95b5b; --line:color-mix(in srgb,currentColor 18%,transparent); }
    * { box-sizing:border-box } body { margin:0;padding:14px;font:13px/1.45 system-ui,-apple-system,sans-serif;background:transparent;color:CanvasText }
    h1 { font-size:17px;margin:0 0 4px } h2 { font-size:14px;margin:0 0 10px } p { margin:4px 0 10px;opacity:.74 }
    .grid { display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;min-height:560px }.stack{display:grid;gap:9px}
    .card { border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,Canvas 94%,currentColor 6%) }
    label{display:grid;gap:4px} select,input,button{font:inherit} select,input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:Canvas;color:CanvasText}
    button{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:Canvas;color:CanvasText}button.primary{background:var(--accent);color:white;border-color:transparent}button.danger{color:var(--danger)}button:disabled{opacity:.45}
    .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.checks label{display:flex;flex-direction:row;align-items:center;gap:5px}.checks input{width:auto}
    .provider{padding:7px;border:1px solid var(--line);border-radius:8px}.provider b::before{content:'●';margin-right:6px;color:var(--danger)}.provider.ok b::before{color:var(--accent)}
    .screen{min-width:0;display:grid;grid-template-rows:auto minmax(320px,1fr) auto auto;gap:9px}.viewport{position:relative;min-height:320px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#101416;outline:none}
    .viewport img{max-width:100%;max-height:calc(100vh - 190px);display:block;user-select:none;-webkit-user-drag:none}.empty{color:#b8c1c1;text-align:center;padding:24px}.status{min-height:20px;font-size:12px;opacity:.78;white-space:pre-line;word-break:break-word}.warning{padding:8px;border-radius:8px;background:color-mix(in srgb,#df9a28 16%,transparent)}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.viewport img{max-height:60vh}}
  </style>
</head>
<body>
  <div class="grid">
    <aside class="stack">
      <section class="card"><h1>远程桌面</h1><p>端到端加密传输；目标机短时授权与配对权限缺一不可。</p><div id="providers" class="stack"></div></section>
      <section class="card stack"><h2>目标机临时共享</h2><label>允许的设备<select id="approvePeer"></select></label><div class="row checks"><label><input id="allowView" type="checkbox" checked>查看</label><label><input id="allowControl" type="checkbox">鼠标键盘</label><label><input id="allowLogin" type="checkbox">系统登录</label></div><label>有效时间（秒）<input id="ttl" type="number" min="30" max="900" value="600"></label><div class="row"><button id="approve" class="primary">开启共享</button><button id="revoke" class="danger">立即撤销</button></div><div id="leases" class="status"></div></section>
      <section class="card stack"><h2>连接远程设备</h2><label>设备<select id="device"></select></label><label>模式<select id="mode"><option value="view">仅查看</option><option value="control">鼠标键盘接管</option><option value="login">系统登录</option></select></label><label>提供器<select id="provider"><option value="user_session">当前用户会话</option><option value="system_login">系统登录提供器</option></select></label><label>窗口 / 显示器<select id="target"></select></label><div class="row"><button id="loadTargets">读取目标</button><button id="connect" class="primary">连接</button><button id="disconnect">断开</button></div></section>
    </aside>
    <main class="screen"><div class="row"><b id="title">尚未连接</b><button id="refresh">刷新画面</button></div><div id="viewport" class="viewport" tabindex="0" aria-label="远程桌面画面"><div id="empty" class="empty">选择已授权设备和窗口后连接。<br>接管模式下点击画面并使用键盘。</div><img id="frame" alt="远程桌面画面" hidden></div><div id="status" class="status"></div><div class="warning">系统登录不接受文本或密码转发；凭据必须由目标机本地认证、系统 SSO 或特权提供器的原生认证界面完成。</div></main>
  </div>
  <script>
  (function(){
    var pending=new Map(),seq=0,state={sessionId:'',mode:'',timer:null,busy:false};
    function el(id){return document.getElementById(id)}
    function call(args){return new Promise(function(resolve,reject){var id='rdv_'+(++seq);pending.set(id,{resolve:resolve,reject:reject});parent.postMessage({source:'cyrene-plugin',type:'call',requestId:id,method:'call',args:args},'*')}).then(function(r){if(r&&r.ok===false)throw new Error(r.error||r.code||'请求失败');return r||{}})}
    window.addEventListener('message',function(e){var m=e.data||{};if(m.source!=='cyrene-host'||m.type!=='response')return;var p=pending.get(String(m.requestId||''));if(!p)return;pending.delete(String(m.requestId||''));m.ok?p.resolve(m.result):p.reject(new Error(m.error||'请求失败'))});
    function notice(t,bad){el('status').textContent=t||'';el('status').style.color=bad?'#d95b5b':''}
    function fill(node,items,value,label){node.innerHTML='';(items||[]).forEach(function(item){var o=document.createElement('option');o.value=value(item);o.textContent=label(item);node.appendChild(o)})}
    function refreshStatus(){return call({operation:'status'}).then(function(d){fill(el('device'),d.peers,function(p){return p.device_id},function(p){return p.display_name||p.device_id});fill(el('approvePeer'),d.peers,function(p){return p.device_id},function(p){return p.display_name||p.device_id});el('providers').innerHTML=(d.providers||[]).map(function(p){return '<div class="provider '+(p.available?'ok':'')+'"><b>'+p.id+'</b><div>'+(p.available?'可用':'不可用')+' · '+p.scope+'</div></div>'}).join('');el('leases').textContent=(d.leases||[]).map(function(l){return l.peer_device_id.slice(0,12)+' · '+l.permissions.join('/')+' · '+l.remaining_seconds+'s'}).join('\n')||'当前未开启共享'})}
    el('approve').onclick=function(){var permissions=[];if(el('allowView').checked)permissions.push('view');if(el('allowControl').checked)permissions.push('control');if(el('allowLogin').checked)permissions.push('login');call({operation:'approve',peer_device_id:el('approvePeer').value,permissions:permissions,ttl_seconds:Number(el('ttl').value)}).then(refreshStatus).then(function(){notice('目标机短时共享已开启')}).catch(function(e){notice(e.message,true)})};
    el('revoke').onclick=function(){call({operation:'revoke',peer_device_id:el('approvePeer').value}).then(refreshStatus).then(function(){notice('共享已撤销，会话已关闭')}).catch(function(e){notice(e.message,true)})};
    el('mode').onchange=function(){el('provider').value=el('mode').value==='login'?'system_login':'user_session'};
    el('loadTargets').onclick=function(){notice('正在读取远程目标…');call({operation:'targets',device_id:el('device').value,provider:el('provider').value}).then(function(d){fill(el('target'),d.targets,function(t){return t.target_id||t.targetId||''},function(t){return [t.app_name||t.appName,t.title].filter(Boolean).join(' · ')||'系统显示器'});notice('目标列表已更新')}).catch(function(e){notice(e.message,true)})};
    el('connect').onclick=function(){var mode=el('mode').value;notice('正在建立加密会话…');call({operation:'open_'+mode,device_id:el('device').value,provider:el('provider').value,target_id:el('target').value}).then(function(d){state.sessionId=d.session_id;state.mode=mode;el('title').textContent=(d.target&&[(d.target.app_name||d.target.appName),d.target.title].filter(Boolean).join(' · '))||'远程桌面';return frame()}).catch(function(e){notice(e.message,true)})};
    function frame(){if(!state.sessionId||state.busy)return Promise.resolve();state.busy=true;return call({operation:'frame',device_id:el('device').value,session_id:state.sessionId}).then(function(d){el('frame').src='data:'+d.mime_type+';base64,'+d.image_base64;el('frame').hidden=false;el('empty').hidden=true;notice('已连接 · 租约剩余 '+d.remaining_seconds+' 秒')}).catch(function(e){notice(e.message,true)}).finally(function(){state.busy=false})}
    function startPolling(){if(state.timer)clearInterval(state.timer);state.timer=setInterval(frame,700)}el('refresh').onclick=frame;el('frame').onload=startPolling;
    el('disconnect').onclick=function(){if(!state.sessionId)return;var session=state.sessionId;state.sessionId='';if(state.timer)clearInterval(state.timer);state.timer=null;call({operation:'close',device_id:el('device').value,session_id:session}).catch(function(){});el('frame').hidden=true;el('empty').hidden=false;el('title').textContent='尚未连接';notice('已断开')};
    function input(event){if(!state.sessionId||state.mode==='view')return;call({operation:state.mode==='login'?'login_input':'input',device_id:el('device').value,session_id:state.sessionId,event:event}).then(function(){setTimeout(frame,120)}).catch(function(e){notice(e.message,true)})}
    el('viewport').addEventListener('contextmenu',function(e){e.preventDefault()});el('viewport').addEventListener('mousedown',function(e){if(e.target!==el('frame'))return;var r=el('frame').getBoundingClientRect();input({type:e.button===2?'right_click':'click',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});el('viewport').focus()});
    el('viewport').addEventListener('wheel',function(e){if(e.target!==el('frame'))return;e.preventDefault();var r=el('frame').getBoundingClientRect();input({type:'scroll',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,direction:e.deltaY<0?'up':'down',amount:Math.min(240,Math.max(20,Math.abs(Math.round(e.deltaY))))})},{passive:false});
    el('viewport').addEventListener('keydown',function(e){if(!state.sessionId||state.mode==='view')return;e.preventDefault();var mods=[];if(e.ctrlKey)mods.push('CTRL');if(e.metaKey)mods.push('META');if(e.altKey)mods.push('ALT');if(e.shiftKey)mods.push('SHIFT');if(mods.length){if(!['Control','Meta','Alt','Shift'].includes(e.key))input({type:'shortcut',keys:mods.concat([e.key.toUpperCase()])})}else if(e.key.length===1){state.mode==='login'?notice('系统登录禁止转发文本凭据',true):input({type:'text',text:e.key})}else input({type:'key',key:e.key})});
    window.addEventListener('beforeunload',function(){if(state.sessionId)call({operation:'close',device_id:el('device').value,session_id:state.sessionId}).catch(function(){})});refreshStatus().catch(function(e){notice(e.message,true)});
  })();
  </script>
</body>
</html>
