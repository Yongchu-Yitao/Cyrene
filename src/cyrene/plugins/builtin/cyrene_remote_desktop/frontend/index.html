<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="remoteDesktop">Remote Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="desktop-app" data-state="connecting">
    <header class="toolbar">
      <div class="identity">
        <strong id="device-name">Remote Desktop</strong>
      </div>
      <div class="toolbar-actions" hidden aria-hidden="true">
        <button id="file-button" class="icon-button" type="button" title="Send files" aria-label="Send files" data-i18n-title="sendFiles" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
        <button id="display-button" class="icon-button" type="button" title="Switch display" aria-label="Switch display" data-i18n-title="switchDisplay" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button>
        <button id="microphone-button" class="icon-button microphone" type="button" title="Share microphone" aria-label="Share microphone" data-i18n-title="shareMicrophone" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3m-4 0h8"/></svg></button>
        <button id="disconnect-button" class="icon-button danger" type="button" title="Disconnect" aria-label="Disconnect" data-i18n-title="disconnect" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>

    <section id="stage" class="stage" tabindex="0" aria-label="Remote desktop display" data-i18n-aria="desktopDisplay">
      <video id="remote-video-backdrop" class="remote-video-backdrop" autoplay playsinline muted aria-hidden="true"></video>
      <video id="remote-video" autoplay playsinline></video>
      <audio id="remote-audio" autoplay></audio>
      <textarea id="ime-input" class="ime-input" aria-label="Remote keyboard input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="18" rx="3"/><path d="M10 28h12m-6-5v5"/></svg></div>
        <h1 id="empty-title" data-i18n="couldNotConnect">Could not connect</h1>
        <p id="empty-detail" data-i18n="connectionFailed">Connection failed.</p>
        <button id="retry-button" class="secondary" type="button" data-i18n="retry" hidden>Try again</button>
      </div>
      <div id="busy-state" class="busy-state" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><b id="busy-title" data-i18n="connecting">Connecting…</b><small id="busy-detail" data-i18n="negotiating">Negotiating a direct encrypted connection</small></div>
      <div id="permission-banner" class="permission-banner" role="alert" hidden></div>
    </section>

    <div id="popover-scrim" class="popover-scrim" hidden></div>
    <div id="display-menu" class="popover" role="dialog" aria-modal="true" aria-labelledby="display-menu-title" hidden>
      <header class="popover-header">
        <span id="display-menu-title" data-i18n="displays">Displays</span>
        <button id="display-menu-close" class="popover-close" type="button" title="Close" aria-label="Close" data-i18n-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div id="display-list"></div>
    </div>
    <div id="file-menu" class="popover file-popover" role="dialog" aria-modal="true" aria-labelledby="file-menu-title" hidden>
      <header class="popover-header">
        <span id="file-menu-title" data-i18n="fileClipboard">File clipboard</span>
        <button id="file-menu-close" class="popover-close" type="button" title="Close" aria-label="Close" data-i18n-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <button id="choose-files" type="button"><span data-i18n="sendFiles">Send files</span><small data-i18n="fileChannelDetail">Use existing encrypted file channel</small></button>
      <button id="choose-folder" type="button"><span data-i18n="sendFolder">Send folder</span><small data-i18n="folderDetail">Keep its directory structure</small></button>
    </div>
    <input id="file-input" type="file" multiple hidden>
    <input id="folder-input" type="file" multiple webkitdirectory hidden>
  </main>
  <script src="remote-desktop.js"></script>
</body>
</html>
