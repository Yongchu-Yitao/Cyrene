<style>
  #cyrene-launch-screen {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: grid;
    place-items: center;
    background: var(--wb-user-bg-light, #f5f6f8);
    color: #171c22;
    opacity: 1;
    visibility: visible;
    transition: opacity 140ms ease, visibility 0s linear 140ms;
  }
  html[data-theme="dark"] #cyrene-launch-screen {
    background: var(--wb-user-bg-dark, #101114);
    color: #f1f1f4;
  }
  #cyrene-launch-screen[data-ready="1"] {
    opacity: 0;
    visibility: hidden;
  }
  .cyrene-launch-brand {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: "Manrope", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .cyrene-launch-brand img {
    display: block;
    width: 72px;
    height: 72px;
  }
  .cyrene-launch-brand strong {
    font-size: 34px;
    font-weight: 720;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  @media (prefers-reduced-motion: reduce) {
    #cyrene-launch-screen { transition: none; }
  }
</style>
<link rel="icon" type="image/png" href="logo-mark.png" />
<script>
(() => {
  try {
    const mode = localStorage.getItem("cyrene-theme-mode") || "system";
    const theme = mode === "system"
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : mode;
    document.documentElement.dataset.theme = theme;
    const readTweak = (key, fallback) => {
      const raw = localStorage.getItem("cyrene-tweak-" + key);
      return raw == null ? fallback : JSON.parse(raw);
    };
    localStorage.removeItem("cyrene-tweak-density");
    document.documentElement.dataset.density = "cozy";
    document.documentElement.dataset.textSize = readTweak("textSize", "default") || "default";
    document.documentElement.dataset.platform =
      (window.cyrene && window.cyrene.platform) || "web";
    document.documentElement.dataset.performanceMode =
      localStorage.getItem("cyrene-performance-mode") === "1" ? "on" : "off";
    const lightBackground = readTweak("backgroundLight", null);
    const darkBackground = readTweak("backgroundDark", null);
    if (/^#[0-9a-f]{6}$/i.test(lightBackground || "")) {
      document.documentElement.style.setProperty("--wb-user-bg-light", lightBackground);
    }
    if (/^#[0-9a-f]{6}$/i.test(darkBackground || "")) {
      document.documentElement.style.setProperty("--wb-user-bg-dark", darkBackground);
    }
    document.documentElement.dataset.booting = "1";
  } catch (e) {}

  let launchReadyRequested = false;
  let launchFinished = false;
  let launchRequestsInFlight = 0;
  let launchIdleTimer = 0;
  let launchDeadlineTimer = 0;
  let launchFontsPending = true;
  let pageInvalidated = false;
  const nativeFetch = window.fetch.bind(window);

  function isSameOriginApiRequest(input) {
    try {
      const raw = typeof input === "string" ? input : String(input && input.url || "");
      const target = new URL(raw, window.location.href);
      return target.origin === window.location.origin && target.pathname.startsWith("/api/");
    } catch (error) {
      return false;
    }
  }

  function invalidatePage(reason) {
    if (pageInvalidated) return;
    pageInvalidated = true;
    try {
      if (window.CyreneUI && window.CyreneUI.has("data")) {
        window.CyreneUI.require("data").dispose();
      }
    } catch (error) {}
    window.dispatchEvent(new CustomEvent("cyrene:page-invalidated", {
      detail: { reason: reason || "authentication_expired" },
    }));
  }

  function guardedFetch(...args) {
    const apiRequest = isSameOriginApiRequest(args[0]);
    if (pageInvalidated && apiRequest) {
      const error = new Error("This Cyrene page is no longer authorized.");
      error.name = "AbortError";
      error.code = "page_invalidated";
      return Promise.reject(error);
    }
    return nativeFetch(...args).then((response) => {
      if (apiRequest && response.status === 401) invalidatePage("authentication_expired");
      return response;
    });
  }
  window.CyrenePageLifecycle = Object.freeze({
    isInvalidated: () => pageInvalidated,
    invalidate: invalidatePage,
  });

  function finishLaunch(force = false) {
    if (launchFinished) return;
    if (launchFontsPending && !force) return;
    launchFinished = true;
    window.clearTimeout(launchIdleTimer);
    window.clearTimeout(launchDeadlineTimer);
    window.fetch = guardedFetch;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      delete document.documentElement.dataset.booting;
      const launchScreen = document.getElementById("cyrene-launch-screen");
      if (!launchScreen) return;
      launchScreen.dataset.ready = "1";
      window.setTimeout(() => launchScreen.remove(), 180);
    }));
  }

  function scheduleLaunchFinish() {
    window.clearTimeout(launchIdleTimer);
    if (!launchReadyRequested || launchFinished || launchRequestsInFlight > 0) return;
    // React surfaces start a few dependent requests after their parent payload
    // renders. Require a short quiet window so those requests join the gate.
    launchIdleTimer = window.setTimeout(finishLaunch, 300);
  }

  window.fetch = (...args) => {
    if (launchFinished) return guardedFetch(...args);
    launchRequestsInFlight += 1;
    window.clearTimeout(launchIdleTimer);
    return guardedFetch(...args).finally(() => {
      launchRequestsInFlight = Math.max(0, launchRequestsInFlight - 1);
      scheduleLaunchFinish();
    });
  };

  function requestLaunchReady() {
    if (launchReadyRequested || launchFinished) return;
    launchReadyRequested = true;
    // A failed or unusually long request must not leave the app inaccessible.
    launchDeadlineTimer = window.setTimeout(() => finishLaunch(true), 20000);
    const fontLoads = document.fonts
      ? [
          document.fonts.load('560 16px "Manrope"', "Cyrene"),
          document.fonts.load('560 16px "Noto Sans SC"', "中文"),
        ]
      : [];
    Promise.allSettled(fontLoads).finally(() => {
      launchFontsPending = false;
      scheduleLaunchFinish();
    });
    scheduleLaunchFinish();
  }
  window.addEventListener("cyrene:ready", requestLaunchReady, { once: true });
})();
</script>
