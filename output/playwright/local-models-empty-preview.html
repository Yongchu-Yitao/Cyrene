<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地模型 · 未安装状态</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 52px;
      color: #edf4fb;
      background:
        radial-gradient(circle at 78% 8%, rgba(43, 126, 109, .13), transparent 36%),
        #08131e;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
    }
    .section {
      width: min(1040px, 100%);
      overflow: hidden;
      border: 1px solid #263746;
      border-radius: 20px;
      background: rgba(16, 31, 44, .91);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .28), inset 0 1px rgba(255,255,255,.025);
    }
    .header {
      padding: 21px 24px 18px;
      border-bottom: 1px solid rgba(111, 139, 158, .15);
    }
    h1 { margin: 0; font-size: 21px; line-height: 1.35; letter-spacing: -.015em; }
    .header p { margin: 7px 0 0; color: #9badba; font-size: 14px; line-height: 1.55; }
    .content { display: grid; gap: 12px; padding: 16px; }
    .model-icon {
      display: grid;
      place-items: center;
      flex: none;
      color: #77c7b2;
    }
    .model {
      min-height: 98px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border: 1px solid rgba(104, 134, 153, .25);
      border-radius: 15px;
      background: rgba(9, 22, 33, .42);
      box-shadow: inset 0 1px rgba(255,255,255,.02);
    }
    .model-icon {
      width: 48px;
      height: 48px;
      border: 1px solid #2b3d4c;
      border-radius: 14px;
      background: #102333;
      color: #8ca2b2;
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }
    .heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
    .heading strong { font-size: 16px; line-height: 1.35; }
    .name { color: #9eb0bd; font-size: 13px; font-weight: 600; }
    .description { margin-top: 7px; color: #8298a8; font-size: 13px; line-height: 1.45; }
    .actions { display: flex; align-items: center; gap: 12px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid #2d3f4e;
      border-radius: 999px;
      background: #102333;
      color: #9badba;
      font-size: 12px;
      white-space: nowrap;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #627786; }
    button {
      height: 38px;
      padding: 0 17px;
      border: 1px solid rgba(74, 180, 151, .48);
      border-radius: 10px;
      background: rgba(42, 124, 104, .28);
      color: #e8f7f3;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 5px 14px rgba(0,0,0,.08);
    }
    svg { display: block; }
  </style>
</head>
<body>
  <section class="section">
    <header class="header">
      <h1>本地模型</h1>
      <p>可选的本机增强能力，数据无需离开设备；下载需手动触发并支持断点续传。</p>
    </header>
    <div class="content">
      <article class="model">
        <span class="model-icon">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.25"/><circle cx="18" cy="6" r="2.25"/><circle cx="12" cy="18" r="2.25"/><path d="m7.9 7.2 2.7 8.6M16.1 7.2l-2.7 8.6M8.3 6h7.4"/></svg>
        </span>
        <div><div class="heading"><strong>本地嵌入模型</strong><span class="name">Qwen3 Embedding 0.6B</span></div><div class="description">1024 维多语言语义检索 · 约 626 MB</div></div>
        <div class="actions"><span class="status"><i class="dot"></i>可选 · 未下载</span><button>下载</button></div>
      </article>
      <article class="model">
        <span class="model-icon">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8M8 14h6"/></svg>
        </span>
        <div><div class="heading"><strong>本地 OCR 模型</strong><span class="name">PP-OCRv6 Medium OCR</span></div><div class="description">本机中英日文及拉丁语系文字识别 · 约 130 MB</div></div>
        <div class="actions"><span class="status"><i class="dot"></i>可选 · 未下载</span><button>下载</button></div>
      </article>
    </div>
  </section>
</body>
</html>
