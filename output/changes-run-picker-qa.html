<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changes run picker QA</title>
  <link rel="stylesheet" href="../src/webui/frontend/workbench.css">
  <style>
    :root {
      --wb-ui-font-scale: 1;
      --wb-text: #eef3fa;
      --wb-muted: #a9b6c8;
      --wb-line: #2a394a;
      --wb-line-2: #3a4a5d;
      --wb-card-bg: #202d40;
      --wb-surface: #172334;
      --wb-accent: #68b79c;
      --wbc-control-shadow: 0 8px 22px rgba(3, 10, 20, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111c2d;
      color: var(--wb-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .qa-panel {
      width: min(520px, calc(100vw - 48px));
      padding: 26px;
      border: 1px solid rgba(125, 145, 168, .26);
      border-radius: 22px;
      background: rgba(32, 45, 64, .86);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035), 0 18px 44px rgba(3, 10, 20, .2);
    }
    .qa-title { margin: 0 0 18px; font-size: 17px; font-weight: 700; }
  </style>
</head>
<body>
  <section class="qa-panel">
    <h1 class="qa-title">变更</h1>
    <div class="wbc-changes-run-picker">
      <select aria-label="最近一次运行">
        <option>最近一次运行</option>
        <option>2026-08-10 21:32</option>
        <option>2026-08-09 18:05</option>
      </select>
      <span class="wbc-changes-run-picker-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
      </span>
    </div>
  </section>
</body>
</html>
