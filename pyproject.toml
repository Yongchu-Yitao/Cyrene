[project]
name = "cyrene"
version = "0.7.8"
description = "Cyrene AI Agent — self-evolving AI companion with SOUL.md memory"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anyio>=4.0",
    "apscheduler>=3.10,<4.0",
    "croniter>=6.0.0",
    "cryptography>=42.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "packaging>=24.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "requests>=2.34.0",
    "sniffio>=1.3.1",
    "simplexng>=0.1.0; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'arm64')",
    "mcp>=1.27.0",
    "numpy>=2.1.0",
    "onnxruntime>=1.27,<1.28; sys_platform == 'darwin' or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
    # ORT 1.27 links the Linux Python extension directly to CUDA 13, which
    # prevents CPU fallback on hosts without that runtime. 1.26 keeps CUDA 12
    # as an optional provider and still imports safely for CPU-only hosts.
    "onnxruntime-gpu>=1.26,<1.27; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "pillow>=11.2.1",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.10",
    "pypdf>=5.5.0",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20",
    "reportlab>=4.4.1",
    "rapidocr>=3.9.0; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'arm64')",
    "rich>=15.0.0",
    "sherpa-onnx==1.13.5",
    "sherpa-onnx-core==1.13.5",
    "soundfile>=0.13.1",
    "tokenizers>=0.21.0",
    "uvicorn>=0.34.0",
    "websockets>=15.0.1",
    "winloop>=0.2.1; sys_platform == 'win32'",
    "openai-codex==0.144.4",
    "mlx-lm>=0.31.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
cyrene = "cyrene.cli:main"
cyrene-relay = "cyrene.runtime.remote_relay:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=11.0"]
# Live browser view + login takeover. Optional: the browser tools fall back to a
# plain httpx fetch when Playwright is absent. After installing, run:
#   playwright install chromium
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyrene", "src/webui", "src/route"]
exclude = [
    "**/*.sqlite3",
    "**/*.sqlite3-shm",
    "**/*.sqlite3-wal",
]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
# Keep the lint baseline explicit so Ruff upgrades cannot silently enable new
# rule families across the existing codebase.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This module is the intentional compatibility facade for the split agent
# implementation. Its imports are the public surface consumed by integrations
# and historical monkeypatch points.
"src/cyrene/agent/__init__.py" = ["F401"]
# These aliases remain part of the lazy agent compatibility facade even when
# their defining modules do not call them directly.
"src/cyrene/agent/message.py" = ["F401"]
"src/cyrene/agent/replies.py" = ["F401"]
# Several tests install dependency stubs in sys.modules before importing the
# modules under test. Moving those imports to the top would defeat the fixture.
"tests/**/*.py" = ["E402"]
