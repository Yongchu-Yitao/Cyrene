[project]
name = "cyrene"
version = "0.7.0b6"
description = "Cyrene AI Agent — self-evolving AI companion with SOUL.md memory"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anyio>=4.0",
    "apscheduler>=3.10,<4.0",
    "croniter>=6.0.0",
    "cryptography>=42.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "packaging>=24.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "requests>=2.34.0",
    "sniffio>=1.3.1",
    "simplexng>=0.1.0",
    "mcp>=1.27.0",
    "pillow>=11.2.1",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.10",
    "pypdf>=5.5.0",
    "python-multipart>=0.0.20",
    "reportlab>=4.4.1",
    "rich>=15.0.0",
    "uvicorn>=0.34.0",
    "websockets>=15.0.1",
    "winloop>=0.2.1; sys_platform == 'win32'",
    "openai-codex==0.144.4",
]

[project.scripts]
cyrene = "cyrene.cli:main"
cyrene-relay = "cyrene.runtime.remote_relay:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=11.0"]
# Live browser view + login takeover. Optional: the browser tools fall back to a
# plain httpx fetch when Playwright is absent. After installing, run:
#   playwright install chromium
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyrene", "src/webui", "src/route"]

[tool.ruff]
line-length = 180

[tool.ruff.lint.per-file-ignores]
# This module is the intentional compatibility facade for the split agent
# implementation. Its imports are the public surface consumed by integrations
# and historical monkeypatch points.
"src/cyrene/agent/__init__.py" = ["F401"]
# Several tests install dependency stubs in sys.modules before importing the
# modules under test. Moving those imports to the top would defeat the fixture.
"tests/**/*.py" = ["E402"]
