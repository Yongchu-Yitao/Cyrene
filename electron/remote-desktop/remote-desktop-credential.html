<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title id="document-title">Remote Desktop credentials</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
    h1 { margin: 0 0 6px; font-size: 19px; }
    p { margin: 0 0 18px; color: GrayText; }
    label { display: grid; gap: 6px; margin: 12px 0; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 7px; background: Field; color: FieldText; }
    input:focus-visible, button:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    footer { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    button { min-height: 42px; padding: 8px 14px; border-radius: 7px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); }
    button.primary { background: Highlight; color: HighlightText; border-color: Highlight; }
  </style>
</head>
<body>
  <h1 id="title">Remote Desktop sign in</h1>
  <p id="device"></p>
  <form id="form" autocomplete="off">
    <label><span id="username-label">Username</span><input id="username" aria-labelledby="username-label" autocomplete="off" maxlength="256" required></label>
    <label><span id="domain-label">Domain (optional)</span><input id="domain" aria-labelledby="domain-label" autocomplete="off" maxlength="256"></label>
    <label><span id="password-label">Password</span><input id="password" aria-labelledby="password-label" type="password" autocomplete="new-password" maxlength="1024" required></label>
    <footer>
      <button id="cancel" type="button">Cancel</button>
      <button id="submit" class="primary" type="submit">Connect</button>
    </footer>
  </form>
  <script src="remote-desktop-credential.js"></script>
</body>
</html>
